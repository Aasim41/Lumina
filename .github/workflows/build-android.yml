name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Build Next.js
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: https://smart-expense-api-rrzq.onrender.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 715706806723-7quvnuboongsi6de300cpdd6gfummr98.apps.googleusercontent.com
        NEXT_PUBLIC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: npm run build

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Sync Capacitor
      working-directory: ./frontend
      run: npx cap sync android

    - name: Generate Release Signing Key
      working-directory: ./frontend/android/app
      run: |
        keytool -genkeypair -v \
          -keystore release.keystore \
          -alias lumina \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass lumina123 \
          -keypass lumina123 \
          -dname "CN=Lumina, OU=Finance, O=Lumina Smart Expense, L=Bangalore, S=KA, C=IN"

    - name: Build Android APK & Play Store AAB Bundle
      working-directory: ./frontend/android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease bundleRelease

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lumina-playstore-artifacts
        path: |
          frontend/android/app/build/outputs/bundle/release/app-release.aab
          frontend/android/app/build/outputs/apk/release/app-release.apk

    - name: Publish Automated Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp frontend/android/app/build/outputs/bundle/release/app-release.aab LUMINA.aab
        cp frontend/android/app/build/outputs/apk/release/app-release.apk LUMINA.apk
        # Delete old release if it exists to keep 'latest' tag fresh
        gh release delete latest --cleanup-tag -y || true
        # Create new release and upload both AAB and APK
        gh release create latest LUMINA.aab LUMINA.apk \
          --title "Latest Play Store Ready Build" \
          --notes "Production build generated from main. Includes LUMINA.aab (Play Store App Bundle) and LUMINA.apk."
